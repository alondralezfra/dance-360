name: Deploy

# Production goes live only from main, and only after the CI workflow finished green on that commit
# (decision record 0035). A pull request from this repository gets a preview version with its own URL
# (the URL is in the job summary), which never touches production. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (permission "Workers Scripts: Edit" plus "Workers Routes: Edit" on the formism.app zone)
# and CLOUDFLARE_ACCOUNT_ID. After a production deploy the smoke-test job opens the live site.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, and never cancel one halfway through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.167.0'
          command: deploy

  smoke-test:
    # After production is live: open the real site and check the basics (decision record 0036). A failure
    # is a red check on the commit, not a rollback: production is already live, so roll back by hand (0035).
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Smoke test formism.app
        run: npm run test:smoke
        env:
          CI: '1'

      - name: Keep the Playwright trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-trace
          path: test-results/

  preview:
    # Not for pull requests from forks or from Dependabot: GitHub gives those no secrets.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload a preview version
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.167.0'
          command: versions upload --message "PR ${{ github.event.pull_request.number }}"

      - name: Show the preview address
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          {
            echo '### Preview'
            echo
            echo '```'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
