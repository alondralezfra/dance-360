name: CI

# The same gate used locally (`npm run verify`), run on every push to main and
# every pull request. Nothing should merge unless this is green.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the change-discipline check compares against the base branch

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      # Local runs check uncommitted work; in CI the work is already committed,
      # so on pull requests check everything since the base branch.
      - name: Tests, docs and changelog accompany code changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-changes.mjs --base origin/${{ github.base_ref }}

      - name: Verify (lint, tests + coverage, build, end-to-end)
        run: npm run verify
        env:
          CI: '1'

      - name: Keep Playwright traces from failed runs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
